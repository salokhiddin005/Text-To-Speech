<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <meta name="page-token" content="{{ page_token }}">
  <title>Text to Speech</title>
  <style>
    :root {
      --bg:        #0f172a;
      --bg-card:   #1e293b;
      --border:    #334155;
      --text:      #e2e8f0;
      --text-muted:#94a3b8;
      --accent:    #2563eb;
      --danger:    #dc2626;
      --warning:   #f59e0b;
      --success:   #16a34a;
    }
    [data-theme="light"] {
      --bg:        #f8fafc;
      --bg-card:   #ffffff;
      --border:    #cbd5e1;
      --text:      #0f172a;
      --text-muted:#64748b;
      --accent:    #2563eb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      transition: background 0.15s, color 0.15s;
    }
    .container { max-width: 720px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 8px;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    h1 { font-size: 22px; margin: 0; font-weight: 600; }
    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin: 0 0 6px;
    }
    select, textarea, input[type="range"] {
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    select { padding: 10px 12px; cursor: pointer; }
    select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { min-height: 180px; padding: 14px; resize: vertical; }
    .field { margin-bottom: 12px; }
    .voice-row { display: flex; gap: 8px; align-items: stretch; }
    .voice-row select { flex: 1; }
    .char-count {
      text-align: right;
      font-size: 12px;
      color: var(--text-muted);
      margin: -4px 4px 8px 0;
      font-variant-numeric: tabular-nums;
    }
    .char-count.warn   { color: var(--warning); }
    .char-count.danger { color: var(--danger); }
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 12px;
    }
    .examples button, .history-list button, .preview-btn, .theme-btn {
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
    }
    .examples button:hover, .history-list button:hover, .preview-btn:hover, .theme-btn:hover {
      border-color: var(--accent);
    }
    .preview-btn { white-space: nowrap; padding: 0 16px; }
    .preview-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .speed-row { display: flex; align-items: center; gap: 12px; }
    .speed-row input[type="range"] { flex: 1; accent-color: var(--accent); background: transparent; border: 0; }
    .speed-value { min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
    .stream-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    button.action {
      flex: 1; min-width: 120px;
      padding: 14px; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s, transform 0.05s;
      font-family: inherit;
    }
    button.action:active { transform: translateY(1px); }
    button.action:disabled { opacity: 0.4; cursor: not-allowed; }
    .speak    { background: var(--accent); color: white; }
    .stop     { background: #475569; color: white; }
    .download { background: var(--success); color: white; }
    .clear    { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .status { margin-top: 14px; color: var(--text-muted); font-size: 14px; min-height: 20px; }
    .waveform {
      width: 100%; height: 60px; margin-top: 12px;
      background: var(--bg-card); border-radius: 10px;
      border: 1px solid var(--border);
      display: block;
    }
    .history { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
    .history h2 {
      font-size: 13px; color: var(--text-muted); margin: 0 0 8px;
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .history-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .history-list button {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .footer {
      margin-top: 32px; padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; gap: 8px;
      font-size: 12px; color: var(--text-muted);
    }
    .footer a { color: var(--text-muted); text-decoration: none; }
    .footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Text to Speech</h1>
      <div class="header-actions">
        <button class="theme-btn" id="themeBtn">Light</button>
      </div>
    </div>

    <div class="field">
      <label for="voice">Voice</label>
      <div class="voice-row">
        <select id="voice">
          {% for voice_id, voice_name in voices.items() %}
          <option value="{{ voice_id }}" {% if voice_id == default_voice %}selected{% endif %}>{{ voice_name }}</option>
          {% endfor %}
        </select>
        <button class="preview-btn" id="previewBtn">Preview</button>
      </div>
    </div>

    <div class="field">
      <label for="text">Text</label>
      <textarea id="text" placeholder="Type or paste text...">Hello, this is my text-to-speech system. It supports multiple voices and adjustable speech speed.</textarea>
      <div class="char-count" id="charCount">0 / 1000</div>
    </div>

    <div class="examples">
      <button data-example="Hello! Welcome to my text to speech system.">Greeting</button>
      <button data-example="Dr. Smith owes me 1234 dollars on the 21st of June at 3:45 p.m.">Numbers test</button>
      <button data-example="The quick brown fox jumps over the lazy dog. This pangram contains every letter of the English alphabet at least once. It contains all the letters from A to Z.">Long paragraph</button>
      <button data-example="Life is what happens to you while you are busy making other plans.">Quote</button>
    </div>

    <div class="field">
      <label for="speed">Speed <span class="speed-value" id="speedValue">1.0x</span></label>
      <div class="speed-row">
        <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0">
      </div>
      <div class="stream-toggle">
        <input type="checkbox" id="streamToggle">
        <label for="streamToggle" style="margin: 0; cursor: pointer;">Stream sentence-by-sentence (faster start)</label>
      </div>
    </div>

    <div class="row">
      <button class="action speak"    id="speakBtn">Speak</button>
      <button class="action stop"     id="stopBtn"     disabled>Stop</button>
      <button class="action download" id="downloadBtn" disabled>Download</button>
      <button class="action clear"    id="clearBtn">Clear</button>
    </div>

    <canvas class="waveform" id="waveform"></canvas>

    <div class="status" id="status">Ready.</div>
    <div class="hint">Shortcuts: Ctrl+Enter to speak, Esc to stop</div>

    <div class="history" id="history" style="display:none">
      <h2>Recent</h2>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="footer">
      <span id="footerStats">—</span>
      <a href="https://github.com/salokhiddin005/Text-To-Speech" target="_blank">github</a>
    </div>

    <audio id="player" style="display:none" crossorigin="anonymous"></audio>
  </div>

  <script>
    const textbox      = document.getElementById('text');
    const voiceSelect  = document.getElementById('voice');
    const previewBtn   = document.getElementById('previewBtn');
    const speedInput   = document.getElementById('speed');
    const speedValue   = document.getElementById('speedValue');
    const streamToggle = document.getElementById('streamToggle');
    const speakBtn     = document.getElementById('speakBtn');
    const stopBtn      = document.getElementById('stopBtn');
    const downloadBtn  = document.getElementById('downloadBtn');
    const clearBtn     = document.getElementById('clearBtn');
    const charCount    = document.getElementById('charCount');
    const themeBtn     = document.getElementById('themeBtn');
    const status       = document.getElementById('status');
    const player       = document.getElementById('player');
    const historyEl    = document.getElementById('history');
    const historyList  = document.getElementById('historyList');
    const footerStats  = document.getElementById('footerStats');
    const waveformCanvas = document.getElementById('waveform');

    const MAX_CHARS    = 1000;
    const WARN_CHARS   = 800;
    const HISTORY_KEY  = 'tts-history';
    const HISTORY_MAX  = 5;
    const THEME_KEY    = 'tts-theme';
    const STREAM_KEY   = 'tts-stream';
    const RELOADED_KEY = 'tts-token-reloaded';

    let currentBlob = null;
    let currentUrl  = null;
    let cancelStream = false;
    let isBusy = false;

    // Speak is blocked while a request is in flight *or* the text is over the
    // limit; both conditions live here so the two callers can't clobber each other.
    function refreshSpeakEnabled() {
      speakBtn.disabled = isBusy || textbox.value.length > MAX_CHARS;
    }

    // ───────── Theme ─────────
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeBtn.textContent = theme === 'light' ? 'Dark' : 'Light';
      localStorage.setItem(THEME_KEY, theme);
    }
    applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    // ───────── Char counter ─────────
    function updateCharCount() {
      const n = textbox.value.length;
      charCount.textContent = `${n} / ${MAX_CHARS}`;
      charCount.classList.toggle('warn',   n > WARN_CHARS && n <= MAX_CHARS);
      charCount.classList.toggle('danger', n > MAX_CHARS);
      // The server rejects anything past MAX_CHARS, so block the request here
      // rather than letting it go out and come back as an error.
      refreshSpeakEnabled();
      if (n > MAX_CHARS) status.textContent = `Too long — trim to ${MAX_CHARS} characters.`;
    }
    textbox.addEventListener('input', updateCharCount);
    updateCharCount();

    // ───────── Speed ─────────
    speedInput.addEventListener('input', () => {
      speedValue.textContent = parseFloat(speedInput.value).toFixed(1) + 'x';
    });

    // ───────── Stream toggle ─────────
    streamToggle.checked = localStorage.getItem(STREAM_KEY) === 'true';
    streamToggle.addEventListener('change', () => {
      localStorage.setItem(STREAM_KEY, String(streamToggle.checked));
    });

    // ───────── Examples ─────────
    document.querySelectorAll('.examples button').forEach((btn) => {
      btn.addEventListener('click', () => {
        textbox.value = btn.dataset.example;
        updateCharCount();
        textbox.focus();
      });
    });

    // ───────── History ─────────
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
      catch { return []; }
    }
    function saveHistory(arr) { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); }
    function addToHistory(text) {
      let h = loadHistory().filter(t => t !== text);
      h.unshift(text);
      h = h.slice(0, HISTORY_MAX);
      saveHistory(h);
      renderHistory();
    }
    function renderHistory() {
      const h = loadHistory();
      if (!h.length) { historyEl.style.display = 'none'; return; }
      historyEl.style.display = 'block';
      historyList.innerHTML = '';
      h.forEach(text => {
        const btn = document.createElement('button');
        btn.textContent = text.length > 50 ? text.slice(0, 47) + '...' : text;
        btn.title = text;
        btn.addEventListener('click', () => {
          textbox.value = text;
          updateCharCount();
          textbox.focus();
        });
        historyList.appendChild(btn);
      });
    }
    renderHistory();

    // ───────── Stats ─────────
    async function refreshStats() {
      try {
        const r = await fetch('/api/stats');
        const s = await r.json();
        footerStats.textContent = `${s.requests} synthesis${s.requests === 1 ? '' : 'es'} this session`;
      } catch { footerStats.textContent = ''; }
    }
    refreshStats();

    // ───────── Synthesis core ─────────
    function setBusy(busy) {
      isBusy = busy;
      stopBtn.disabled  = !busy;
      previewBtn.disabled = busy;
      refreshSpeakEnabled();
    }

    // Issued by the server when this page was rendered; /speak requires it.
    const PAGE_TOKEN = document.querySelector('meta[name="page-token"]').content;

    async function synthesize(text, voice, speed) {
      const res = await fetch('/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Page-Token': PAGE_TOKEN },
        body: JSON.stringify({ text, voice, speed }),
      });
      if (!res.ok) {
        // The token has a lifetime, so a tab left open for a long time can go
        // stale. Reloading mints a fresh one — there is deliberately no endpoint
        // that hands out tokens, since that would be trivially scriptable.
        if (res.status === 403) {
          const body = await res.json().catch(() => ({}));
          if (body.code === 'bad_page_token') {
            // Reload only once: offline, the service worker replays the cached
            // page with the same stale token, which would otherwise loop forever.
            if (!sessionStorage.getItem(RELOADED_KEY)) {
              sessionStorage.setItem(RELOADED_KEY, '1');
              status.textContent = 'Session expired — refreshing...';
              location.reload();
            } else {
              status.textContent = 'Session expired. Please reload the page.';
            }
            throw new Error('page token expired');
          }
        }
        throw new Error(`server error ${res.status}`);
      }
      sessionStorage.removeItem(RELOADED_KEY);
      return res.blob();
    }

    function splitSentences(text) {
      const matches = text.match(/[^.!?]+[.!?]+\s*/g);
      if (!matches || matches.length === 0) return [text];
      return matches.map(s => s.trim()).filter(Boolean);
    }

    async function speakWhole(text, voice, speed) {
      status.textContent = 'Synthesizing...';
      const blob = await synthesize(text, voice, speed);
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentBlob = blob;
      currentUrl  = URL.createObjectURL(blob);
      player.src = currentUrl;
      await player.play();
      status.textContent = 'Playing...';
      downloadBtn.disabled = false;
    }

    async function speakStreaming(text, voice, speed) {
      const sentences = splitSentences(text);
      const queue = [];
      cancelStream = false;
      let producerDone = false;

      // Producer: fetch each sentence in order
      const produce = (async () => {
        for (let i = 0; i < sentences.length; i++) {
          if (cancelStream) return;
          try {
            const blob = await synthesize(sentences[i], voice, speed);
            queue.push(blob);
          } catch (e) {
            status.textContent = 'Error: ' + e.message;
            cancelStream = true;
            return;
          }
        }
        producerDone = true;
      })();

      // Consumer: play sentences as they arrive
      let firstPlayed = false;
      while (!cancelStream) {
        if (queue.length === 0) {
          if (producerDone) break;
          await new Promise(r => setTimeout(r, 50));
          continue;
        }
        const blob = queue.shift();
        if (!firstPlayed) {
          firstPlayed = true;
          status.textContent = 'Playing...';
        }
        if (currentUrl) URL.revokeObjectURL(currentUrl);
        currentBlob = blob;
        currentUrl  = URL.createObjectURL(blob);
        player.src = currentUrl;
        await new Promise((resolve) => {
          player.onended = resolve;
          player.onerror = resolve;
          player.play().catch(resolve);
        });
      }
      // Final download blob = the last one (or you could merge — keep simple)
      downloadBtn.disabled = !currentBlob;
      await produce;
    }

    async function speak() {
      const text = textbox.value.trim();
      if (!text) return;
      setBusy(true);
      downloadBtn.disabled = true;
      try {
        if (streamToggle.checked) {
          await speakStreaming(text, voiceSelect.value, parseFloat(speedInput.value));
        } else {
          await speakWhole(text, voiceSelect.value, parseFloat(speedInput.value));
        }
        addToHistory(text);
        refreshStats();
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
        setBusy(false);
      }
    }

    function stop() {
      cancelStream = true;
      player.pause();
      player.currentTime = 0;
      status.textContent = 'Stopped.';
      setBusy(false);
    }

    function download() {
      if (!currentBlob) return;
      const a = document.createElement('a');
      a.href = currentUrl;
      a.download = `speech-${Date.now()}.wav`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      status.textContent = 'Downloaded.';
    }

    // ───────── Voice preview ─────────
    previewBtn.addEventListener('click', async () => {
      const original = previewBtn.textContent;
      previewBtn.disabled = true;
      previewBtn.textContent = 'Loading...';
      status.textContent = 'Previewing voice...';
      try {
        const blob = await synthesize('Hello, this is a sample of this voice.', voiceSelect.value, 1.0);
        if (currentUrl) URL.revokeObjectURL(currentUrl);
        currentUrl = URL.createObjectURL(blob);
        player.src = currentUrl;
        await player.play();
        status.textContent = 'Playing preview...';
      } catch (err) {
        status.textContent = 'Preview error: ' + err.message;
      } finally {
        previewBtn.textContent = original;
        previewBtn.disabled = false;
      }
    });

    // ───────── Buttons ─────────
    speakBtn.addEventListener('click', speak);
    stopBtn.addEventListener('click', stop);
    downloadBtn.addEventListener('click', download);
    clearBtn.addEventListener('click', () => {
      textbox.value = '';
      updateCharCount();
      textbox.focus();
    });
    player.addEventListener('ended', () => {
      if (!streamToggle.checked) {
        status.textContent = 'Done.';
        setBusy(false);
      }
    });

    // ───────── Keyboard shortcuts ─────────
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (!speakBtn.disabled) speak();
      } else if (e.key === 'Escape' && !stopBtn.disabled) {
        stop();
      }
    });

    // ───────── Waveform visualization ─────────
    let audioCtx = null;
    let analyser = null;
    let waveformActive = false;

    function setupWaveform() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaElementSource(player);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (e) {
        console.warn('Waveform setup failed:', e);
      }
    }

    function drawWaveform() {
      if (!analyser) return;
      const ctx = waveformCanvas.getContext('2d');
      const width = waveformCanvas.width = waveformCanvas.offsetWidth * window.devicePixelRatio;
      const height = waveformCanvas.height = waveformCanvas.offsetHeight * window.devicePixelRatio;
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2563eb';

      const data = new Uint8Array(analyser.frequencyBinCount);
      const barCount = data.length;
      const barWidth = width / barCount;

      function loop() {
        if (!waveformActive) {
          ctx.clearRect(0, 0, width, height);
          return;
        }
        analyser.getByteFrequencyData(data);
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = accent;
        for (let i = 0; i < barCount; i++) {
          const v = data[i] / 255;
          const barHeight = v * height * 0.9;
          const x = i * barWidth;
          ctx.fillRect(x + 1, height - barHeight, barWidth - 2, barHeight);
        }
        requestAnimationFrame(loop);
      }
      loop();
    }

    player.addEventListener('play', () => {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      setupWaveform();
      waveformActive = true;
      drawWaveform();
    });
    player.addEventListener('pause', () => { waveformActive = false; });
    player.addEventListener('ended', () => { waveformActive = false; });

    // ───────── Service worker ─────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
