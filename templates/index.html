<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text to Speech</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 16px;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      min-height: 220px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .speak { background: #2563eb; color: white; }
    .stop  { background: #475569; color: white; }
    .clear { background: transparent; color: #94a3b8; border: 1px solid #334155; }
    .status {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Text to Speech</h1>
    <textarea id="text" placeholder="Type or paste text...">Hello from my phone. This is my text to speech system, running on my laptop.</textarea>
    <div class="row">
      <button class="speak" id="speakBtn">Speak</button>
      <button class="stop" id="stopBtn" disabled>Stop</button>
      <button class="clear" id="clearBtn">Clear</button>
    </div>
    <div class="status" id="status">Ready.</div>
    <audio id="player" style="display:none"></audio>
  </div>

  <script>
    const textbox  = document.getElementById('text');
    const speakBtn = document.getElementById('speakBtn');
    const stopBtn  = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const status   = document.getElementById('status');
    const player   = document.getElementById('player');

    let currentUrl = null;

    function setBusy(busy) {
      speakBtn.disabled = busy;
      stopBtn.disabled  = !busy;
    }

    async function speak() {
      const text = textbox.value.trim();
      if (!text) return;
      setBusy(true);
      status.textContent = 'Synthesizing...';
      try {
        const res = await fetch('/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) throw new Error(`server error ${res.status}`);
        const blob = await res.blob();
        if (currentUrl) URL.revokeObjectURL(currentUrl);
        currentUrl = URL.createObjectURL(blob);
        player.src = currentUrl;
        await player.play();
        status.textContent = 'Playing...';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
        setBusy(false);
      }
    }

    function stop() {
      player.pause();
      player.currentTime = 0;
      status.textContent = 'Stopped.';
      setBusy(false);
    }

    speakBtn.addEventListener('click', speak);
    stopBtn.addEventListener('click', stop);
    clearBtn.addEventListener('click', () => { textbox.value = ''; });

    player.addEventListener('ended', () => {
      status.textContent = 'Done.';
      setBusy(false);
    });
  </script>
</body>
</html>
