services:
  - type: web
    name: tts-flask
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python download_model.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Declared here so a deploy prompts for the value instead of the endpoint
      # silently staying disabled. Left unset, /api/speak returns 503 and
      # /health reports api_configured false.
      - key: API_KEYS
        sync: false
      # Signs page tokens; generated per process when unset, which would
      # invalidate outstanding tokens on every restart.
      - key: SECRET_KEY
        generateValue: true
