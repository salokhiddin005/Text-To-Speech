[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "models", "hf-space", "flask-space", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
